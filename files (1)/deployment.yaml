apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-consumer
  labels:
    app: inference-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-consumer
  template:
    metadata:
      labels:
        app: inference-consumer
    spec:
      containers:
        - name: consumer
          # Build: docker build -t inference-consumer .
          # Push to ECR or Docker Hub and update the image reference below.
          image: inference-consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-inference-secrets
                  key: region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-inference-secrets
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-inference-secrets
                  key: secret-access-key
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: aws-inference-secrets
                  key: s3-bucket
            - name: AWS_SQS_URL
              valueFrom:
                secretKeyRef:
                  name: aws-inference-secrets
                  key: sqs-url
            - name: POLL_INTERVAL
              value: "3"
            - name: SQS_BATCH_SIZE
              value: "10"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Scale manually: kubectl scale deployment inference-consumer --replicas=3
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-consumer-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-consumer
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
